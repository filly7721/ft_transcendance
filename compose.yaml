name: arcade

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcade
      POSTGRES_DB: arcade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcade -d arcade']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://arcade:${POSTGRES_PASSWORD}@db:5432/arcade
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://localhost}
      TRUST_PROXY: 'true'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-https://localhost}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certs:/certs

volumes:
  pgdata:
  uploads:
  certs:
